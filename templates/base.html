<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Randima Alexander | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKB4Imkb9q8cVv+o5pQ5N0iZ1Q+3BqE97v3gXqkLh9pRyt5ur+o3Lr0XWxxd1FQ2KdP6Wf0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a class="logo" href="{{ url_for('home') }}">RA</a>
        <div class="nav-links">
          <a href="{{ url_for('home') }}">Home</a>
          <a href="{{ url_for('about') }}">About</a>
          <a href="{{ url_for('skills') }}">Skills</a>
          <a href="{{ url_for('projects') }}">Projects</a>
          <a href="{{ url_for('contact') }}" class="nav-cta">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div>
        <h3>Let&apos;s build something impactful.</h3>
        <p>Based in Sri Lanka · Available for analytics, research, and web projects.</p>
      </div>
      <div class="footer-links">
        <a href="mailto:randima.alexander@email.com">randima.alexander@email.com</a>
        <span>© {{ current_year }} Randima Alexander</span>
      </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
